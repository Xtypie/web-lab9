name: PHP CI/CD Pipeline (Lab 9)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 🔹 ШТРАФНОЕ ЗАДАНИЕ 1: Разделение пайплайна на 2 job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker compose build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start Services
        run: docker compose up -d --build

      # 🔹 ШТРАФНОЕ ЗАДАНИЕ 2: Ожидание сервисов
      - name: Wait for services
        run: sleep 15

      # 🔹 ШТРАФНОЕ ЗАДАНИЕ 3: Проверка контейнеров
      - name: Check containers
        run: docker ps

      # 🔹 ШТРАФНОЕ ЗАДАНИЕ 4: Установка зависимостей
      - name: Install Composer dependencies
        run: docker compose exec -T php composer install --no-interaction

      # 🔹 ШТРАФНОЕ ЗАДАНИЕ 5: Использование переменных окружения
      - name: Load .env.test & Run Tests
        run: |
          if [ -f .env.test ]; then export $(cat .env.test | xargs); fi
          echo "✅ Env loaded: RABBITMQ_HOST=$RABBITMQ_HOST"
          docker compose exec -T php vendor/bin/phpunit --configuration phpunit.xml --testdox

      # 🔹 ШТРАФНОЕ ЗАДАНИЕ 6: Логирование ошибок при падении
      - name: Show logs on failure
        if: failure()
        run: |
          echo "❌ Tests failed! Container logs:"
          docker compose logs php
          docker compose logs rabbitmq

      - name: Stop containers
        if: always()
        run: docker compose down -v