name: PHP CI/CD Pipeline (Lab 9)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker compose build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start Services
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 15

      - name: Check containers
        run: docker ps

      # 🔹 ВАЖНО: Сначала устанавливаем зависимости!
      - name: Install Composer dependencies
        run: docker compose exec -T php composer install --no-interaction

      - name: Run PHPUnit Tests
        run: docker compose exec -T php vendor/bin/phpunit --configuration phpunit.xml --testdox

      - name: Show logs on failure
        if: failure()
        run: |
          echo "❌ Tests failed! Showing container logs:"
          docker compose logs php
          docker compose logs rabbitmq

      - name: Stop containers
        if: always()
        run: docker compose down -v